<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151413" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kotoba" />
    <meta name="description" content="Spaced repetition, grammar lessons and progress tracking for learning Japanese." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kotoba</title>
    <style>
      html, body { margin: 0; background: #151413; color: #ede7e2; }
      #boot-fallback { display: none; font: 16px/1.5 system-ui, sans-serif; padding: 32px 24px; max-width: 460px; margin: 0 auto; }
      #boot-fallback button { font: inherit; padding: 12px 20px; border-radius: 999px; border: 0; background: #ee8559; color: #2a1206; font-weight: 600; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback">
      <h1 style="font-size:1.4rem">The app didn't start</h1>
      <p>This can happen after an update when an old copy is cached. Your study data is stored separately and will not be deleted.</p>
      <button id="boot-reset">Reload with a fresh copy</button>
    </div>
    <script>
      // If the app has not started after a few seconds, offer a safe reset of the cached files.
      (function () {
        var timer = setTimeout(function () {
          if (window.__ntBooted) return;
          document.getElementById("boot-fallback").style.display = "block";
        }, 7000);
        document.getElementById("boot-reset").addEventListener("click", async function () {
          try {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          } catch (e) {}
          location.reload();
        });
        window.addEventListener("nt-booted", function () { clearTimeout(timer); document.getElementById("boot-fallback").style.display = "none"; });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
